<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D Human Anatomy</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #13131f;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      touch-action: none;
    }

    /* Canvas fills the entire screen, behind everything */
    #c {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      display: block;
    }

    /* ── Toggle button (always visible) ── */
    #toggle {
      position: fixed;
      top: 14px; right: 14px;
      z-index: 20;
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(10,10,20,0.75);
      color: #eee;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Side panel ── */
    #panel {
      position: fixed;
      top: 0; right: 0;
      width: min(260px, 85vw);
      height: 100%;
      background: rgba(8,8,18,0.88);
      border-left: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(14px);
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 0;
      transform: translateX(100%);
      transition: transform 0.28s ease;
      overflow-y: auto;
      padding: 64px 16px 24px;
    }
    #panel.open { transform: translateX(0); }

    .section {
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 14px 0;
    }
    .section:last-child { border-bottom: none; }

    .sec-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #556;
      margin-bottom: 10px;
    }

    /* Swatches */
    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .sw {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform .12s, border-color .12s;
    }
    .sw:hover { transform: scale(1.15); }
    .sw.on { border-color: #fff; }

    /* Color picker */
    .color-pick {
      width: 100%; height: 36px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      cursor: pointer;
      padding: 2px;
      background: transparent;
      margin-top: 10px;
    }

    /* Slider row */
    .sl-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .sl-row:last-child { margin-bottom: 0; }
    .sl-lbl {
      font-size: 11px;
      color: #778;
      width: 80px;
      flex-shrink: 0;
    }
    input[type=range] {
      flex: 1;
      accent-color: #7eaaff;
      height: 4px;
    }
    .sl-val {
      font-size: 11px;
      color: #aaa;
      width: 28px;
      text-align: right;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #ccc;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background .15s;
      margin-bottom: 8px;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .btn.on { background: rgba(100,160,255,0.22); border-color: rgba(100,160,255,0.4); color: #aad4ff; }
    .btn.red { border-color: rgba(255,80,80,0.25); color: #f88; }
    .btn.red:hover { background: rgba(255,80,80,0.14); }

    /* Info bar */
    #info {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<!-- Three.js canvas — positioned first in DOM, z-index 0 -->
<canvas id="c"></canvas>

<!-- Panel toggle -->
<button id="toggle" aria-label="Toggle panel">⚙</button>

<!-- Side panel -->
<div id="panel">

  <div class="section">
    <div class="sec-label">Skin Color</div>
    <div class="swatches" id="swatches"></div>
    <input type="color" class="color-pick" id="picker" value="#e8c9a0" />
  </div>

  <div class="section">
    <div class="sec-label">Light</div>
    <div class="sl-row">
      <span class="sl-lbl">Intensity</span>
      <input type="range" id="li" min="0" max="5" step="0.1" value="2.5" />
      <span class="sl-val" id="li-v">2.5</span>
    </div>
    <div class="sl-row">
      <span class="sl-lbl">Ambient</span>
      <input type="range" id="ai" min="0" max="2" step="0.05" value="0.5" />
      <span class="sl-val" id="ai-v">0.5</span>
    </div>
    <div class="sl-row" style="margin-top:6px">
      <span class="sl-lbl">Light Color</span>
      <input type="color" id="lc" value="#ffffff"
        style="flex:1;height:30px;border:1px solid rgba(255,255,255,0.1);border-radius:6px;cursor:pointer;background:transparent;padding:2px;" />
    </div>
    <div style="margin-top:10px">
      <button class="btn" id="moveBtn">☀ Move Light</button>
    </div>
  </div>

  <div class="section">
    <button class="btn red" id="resetBtn">↺ Reset All</button>
  </div>

</div>

<div id="info">Pinch/scroll to zoom · Drag to rotate</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Renderer ──────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ── Scene / Camera ────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x13131f);
scene.fog = new THREE.Fog(0x13131f, 14, 36);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.7, 6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 14;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Lights ────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(3, 5, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4;
sun.shadow.camera.top = 6;  sun.shadow.camera.bottom = -2;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x4466ff, 0.4);
rim.position.set(-3, 2, -4);
scene.add(rim);

// Light position indicator
const lightBall = new THREE.Mesh(
  new THREE.SphereGeometry(0.11, 14, 14),
  new THREE.MeshBasicMaterial({ color: 0xffff88 })
);
lightBall.position.copy(sun.position);
scene.add(lightBall);

// ── Floor ─────────────────────────────────────────────────────────────
const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(24, 24),
  new THREE.ShadowMaterial({ opacity: 0.28 })
);
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.receiveShadow = true;
scene.add(floorMesh);
scene.add(new THREE.GridHelper(18, 36, 0x2a2a44, 0x1e1e36));

// ── Human Figure ──────────────────────────────────────────────────────
const mat = new THREE.MeshStandardMaterial({ color: 0xe8c9a0, roughness: 0.55, metalness: 0.02 });
const human = new THREE.Group();
scene.add(human);

function limb(geo, x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.scale.set(sx, sy, sz);
  m.castShadow = true;
  m.receiveShadow = true;
  human.add(m);
  return m;
}

const Sp = (r, w = 20, h = 20) => new THREE.SphereGeometry(r, w, h);
const Cy = (rt, rb, len, s = 14) => new THREE.CylinderGeometry(rt, rb, len, s);

// Head & neck
limb(Sp(0.24, 24, 24),        0, 3.28, 0);
limb(Cy(0.10, 0.12, 0.28),    0, 2.93, 0);

// Torso
limb(Cy(0.38, 0.34, 0.70, 20), 0, 2.35, 0);
limb(Cy(0.34, 0.30, 0.42, 20), 0, 1.83, 0);
limb(Cy(0.32, 0.26, 0.35, 20), 0, 1.46, 0);

// Arms (left s=-1, right s=1)
for (const s of [-1, 1]) {
  limb(Sp(0.15, 14, 14),          s*0.50, 2.58, 0,  0, 0,  0      ); // shoulder
  limb(Cy(0.09, 0.08, 0.62),      s*0.62, 2.22, 0,  0, 0,  s*0.18 ); // upper arm
  limb(Sp(0.085, 10, 10),         s*0.66, 1.87, 0                  ); // elbow
  limb(Cy(0.075, 0.065, 0.56),    s*0.73, 1.56, 0.04, 0.08,0,s*0.22); // forearm
  limb(Sp(0.09, 10, 10),          s*0.83, 1.14, 0.07, 0,0,0, 1.1,0.9,0.7); // hand
}

// Legs
for (const s of [-1, 1]) {
  limb(Cy(0.16, 0.14, 0.72, 16),  s*0.18, 0.88, 0  ); // upper leg
  limb(Sp(0.12, 12, 12),          s*0.18, 0.49, 0.02); // knee
  limb(Cy(0.10, 0.085, 0.68),     s*0.18, 0.13, 0   ); // lower leg
  limb(Sp(0.09, 10, 10),          s*0.18,-0.32, 0.06, 0,0,0, 0.9,0.5,1.4); // foot
}

// Eyes
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
for (const s of [-1, 1]) {
  const eye = new THREE.Mesh(Sp(0.04, 8, 8), eyeMat);
  eye.position.set(s * 0.085, 3.25, 0.21);
  human.add(eye);
}

// ── Color swatches ────────────────────────────────────────────────────
const SKINS = [
  '#f5deb3','#e8c9a0','#d4a574','#c68642',
  '#8d5524','#4a2912','#ff6b6b','#45b7d1',
  '#96ceb4','#dfe6e9',
];

const swatchContainer = document.getElementById('swatches');
SKINS.forEach((hex, i) => {
  const d = document.createElement('div');
  d.className = 'sw' + (i === 1 ? ' on' : '');
  d.style.background = hex;
  d.addEventListener('click', () => {
    document.querySelectorAll('.sw').forEach(x => x.classList.remove('on'));
    d.classList.add('on');
    mat.color.set(hex);
    document.getElementById('picker').value = hex;
  });
  swatchContainer.appendChild(d);
});

document.getElementById('picker').addEventListener('input', e => {
  mat.color.set(e.target.value);
  document.querySelectorAll('.sw').forEach(x => x.classList.remove('on'));
});

// ── Light sliders ─────────────────────────────────────────────────────
const liSlider = document.getElementById('li');
const aiSlider = document.getElementById('ai');
const liVal    = document.getElementById('li-v');
const aiVal    = document.getElementById('ai-v');

liSlider.addEventListener('input', () => { sun.intensity = +liSlider.value; liVal.textContent = liSlider.value; });
aiSlider.addEventListener('input', () => { ambient.intensity = +aiSlider.value; aiVal.textContent = aiSlider.value; });
document.getElementById('lc').addEventListener('input', e => {
  sun.color.set(e.target.value);
  lightBall.material.color.set(e.target.value);
});

// ── Move Light ────────────────────────────────────────────────────────
let lightMode = false;
let draggingLight = false;
const moveBtn = document.getElementById('moveBtn');
const dragPlane = new THREE.Plane();
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const hit = new THREE.Vector3();

moveBtn.addEventListener('click', () => {
  lightMode = !lightMode;
  moveBtn.classList.toggle('on', lightMode);
  moveBtn.textContent = lightMode ? '✕ Done Moving' : '☀ Move Light';
  controls.enabled = !lightMode;
  document.getElementById('info').textContent = lightMode
    ? 'Drag canvas to reposition the light'
    : 'Pinch/scroll to zoom · Drag to rotate';
});

canvas.addEventListener('pointerdown', e => {
  if (!lightMode) return;
  draggingLight = true;
  applyLightMove(e);
});
canvas.addEventListener('pointermove', e => {
  if (!lightMode || !draggingLight) return;
  applyLightMove(e);
});
canvas.addEventListener('pointerup', () => { draggingLight = false; });

function applyLightMove(e) {
  const rect = canvas.getBoundingClientRect();
  ndc.set(
    ((e.clientX - rect.left) / rect.width)  *  2 - 1,
    ((e.clientY - rect.top)  / rect.height) * -2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  dragPlane.setFromNormalAndCoplanarPoint(
    camera.getWorldDirection(new THREE.Vector3()).negate(),
    lightBall.position
  );
  if (raycaster.ray.intersectPlane(dragPlane, hit)) {
    lightBall.position.copy(hit);
    sun.position.copy(hit);
  }
}

// ── Panel toggle ──────────────────────────────────────────────────────
const panel = document.getElementById('panel');
document.getElementById('toggle').addEventListener('click', () => {
  panel.classList.toggle('open');
});

// ── Reset ─────────────────────────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', () => {
  mat.color.set(0xe8c9a0);
  document.getElementById('picker').value = '#e8c9a0';
  document.querySelectorAll('.sw').forEach((d, i) => d.classList.toggle('on', i === 1));

  sun.position.set(3, 5, 3); sun.intensity = 2.5; sun.color.set(0xffffff);
  lightBall.position.copy(sun.position); lightBall.material.color.set(0xffff88);
  ambient.intensity = 0.5;
  liSlider.value = 2.5; liVal.textContent = '2.5';
  aiSlider.value = 0.5; aiVal.textContent = '0.5';
  document.getElementById('lc').value = '#ffffff';

  camera.position.set(0, 1.7, 6);
  controls.target.set(0, 1.2, 0);

  if (lightMode) moveBtn.click();
});

// ── Render loop ───────────────────────────────────────────────────────
let t = 0;
(function loop() {
  requestAnimationFrame(loop);
  t += 0.006;
  human.rotation.y = Math.sin(t * 0.4) * 0.025;
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
