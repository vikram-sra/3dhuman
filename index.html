<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AnatomyPro 7.0 - Hyper-Realistic Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #050508;
      --panel-bg: rgba(12, 12, 20, 0.85);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --text: #ffffff;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --glass: rgba(255, 255, 255, 0.02);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Public Sans', sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #c {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    /* UI Overlay */
    .studio-ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      padding: 40px;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .logo {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      padding: 16px 24px;
      border-radius: 20px;
      border: 1px solid var(--border);
      pointer-events: auto;
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: white;
    }

    .logo span {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Controls Sidebar */
    .sidebar {
      position: fixed;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      width: 340px;
      background: var(--panel-bg);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      pointer-events: auto;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar.hidden {
      transform: translateY(-50%) translateX(420px);
      opacity: 0;
    }

    .section-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .tab-group {
      display: flex;
      background: var(--glass);
      padding: 5px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 12px;
      transition: 0.3s;
    }

    .tab-btn.active {
      background: white;
      color: black;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .label-box {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid var(--accent);
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .swatch {
      aspect-ratio: 1;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.2s;
    }

    .swatch.active {
      border-color: white;
      transform: scale(1.1);
    }

    .action-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 8px;
    }

    .action-btn:hover {
      background: #60a5fa;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px var(--accent-glow);
    }

    /* Bottom Toolbar */
    .toolbar {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      padding: 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      pointer-events: auto;
    }

    .tool-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .tool-btn:hover {
      background: var(--glass);
      color: white;
    }

    .tool-btn.active {
      background: var(--accent);
      color: white;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .progress-bar {
      width: 200px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>

<body>

  <div id="loading">
    <p style="font-weight: 800; letter-spacing: 0.3em; text-transform: uppercase; font-size: 14px;">AnatomyPro 7.0</p>
    <div class="progress-bar">
      <div class="progress-fill" id="load-progress"></div>
    </div>
    <p
      style="margin-top: 15px; font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em;">
      Loading High-Fidelity Bio-Assets</p>
  </div>

  <canvas id="c"></canvas>

  <div class="studio-ui">
    <div class="header">
      <div class="logo">
        <h1>Anatomy Studio</h1>
        <span>Gen-7 Hyper Reality</span>
      </div>
    </div>

    <div class="sidebar" id="sidebar">
      <div class="section">
        <div class="section-title">Gender Phenotype</div>
        <div class="tab-group" id="gender-tabs">
          <button class="tab-btn active" data-gender="male">Phenotype M</button>
          <button class="tab-btn" data-gender="female">Phenotype F</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Anatomical Metrics</div>
        <div class="control-row">
          <div class="label-box"><span>Hypertrophy (Muscle)</span><span id="label-muscle">50%</span></div>
          <input type="range" id="slider-muscle" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="control-row" style="margin-top: 16px;">
          <div class="label-box"><span>Adipose (Soft Tissue)</span><span id="label-adipose">20%</span></div>
          <input type="range" id="slider-adipose" min="0" max="1" step="0.01" value="0.2">
        </div>
      </div>

      <div class="section">
        <div class="section-title">Visual Modes</div>
        <div class="tab-group" id="mode-tabs">
          <button class="tab-btn active" data-mode="skin">Kinetic</button>
          <button class="tab-btn" data-mode="skeletal">Neural</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Ethnicity Spectrum</div>
        <div class="color-grid" id="skin-swatches"></div>
      </div>

      <button class="action-btn" id="hide-sidebar-btn">Toggle Interface</button>
    </div>

    <div class="toolbar">
      <button class="tool-btn active" id="tool-orbit" title="Orbit Model">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
          <path d="M2 12h20" />
        </svg>
      </button>
      <button class="tool-btn" id="tool-gesture" title="Gesture Pose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 18V6" />
          <path d="M16 12H8" />
          <path d="M12 6L8 10" />
          <path d="M12 6l4 4" />
        </svg>
      </button>
      <button class="tool-btn" id="tool-reset" title="Calibrate Frame">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      </button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.2/index.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import gsap from 'gsap';

    // ── Studio Core ──────────────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = null; // Background handled by CSS

    // Gradient Background Plane
    const bgGeometry = new THREE.SphereGeometry(15, 32, 24);
    const bgMaterial = new THREE.MeshBasicMaterial({
      color: 0x050508, side: THREE.BackSide,
      transparent: true, opacity: 0.9
    });
    const bgMesh = new THREE.Mesh(bgGeometry, bgMaterial);
    scene.add(bgMesh);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.4, 4.5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.1, 0);

    // ── Professional Studio Lighting ─────────────────────────────────────
    const keyLight = new THREE.DirectionalLight(0xffffff, 3);
    keyLight.position.set(5, 5, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 15;
    keyLight.shadow.camera.left = -3;
    keyLight.shadow.camera.right = 3;
    keyLight.shadow.camera.top = 3;
    keyLight.shadow.camera.bottom = -1;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x88aaff, 1.5);
    fillLight.position.set(-5, 2, 2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xc084fc, 2.5);
    rimLight.position.set(0, 3, -8);
    scene.add(rimLight);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(10, 64),
      new THREE.MeshStandardMaterial({ color: 0x050508, roughness: 0.1, metalness: 0.5 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const studioGrid = new THREE.GridHelper(20, 40, 0x111111, 0x0a0a0a);
    studioGrid.position.y = 0.01;
    scene.add(studioGrid);

    // ── Bio-Engine 7.0 (Realistic Human Hybrid) ─────────────────────────
    // We use a high-quality human mannequin rig (Soldier/Xbot mix)
    // and overlay a dynamic biomechanical mass system.

    const loader = new GLTFLoader();
    let humanModel = null;
    let skeleton = null;
    let bones = {};

    const studioState = {
      gender: 'male',
      view: 'skin',
      muscle: 0.5,
      adipose: 0.2,
      skinColor: 0xd4a574
    };

    // Human Model CDN Source (Stable Three.js Sample)
    const MODEL_URLS = {
      male: 'https://threejs.org/examples/models/gltf/Soldier.glb',
      female: 'https://threejs.org/examples/models/gltf/Xbot.glb'
    };

    function loadModel(gender) {
      if (humanModel) scene.remove(humanModel);

      const progressFill = document.getElementById('load-progress');

      loader.load(MODEL_URLS[gender], (gltf) => {
        humanModel = gltf.scene;
        humanModel.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            child.material = new THREE.MeshStandardMaterial({
              color: studioState.skinColor,
              roughness: 0.4,
              metalness: 0.05,
              emissive: 0x221111,
              emissiveIntensity: 0.1
            });
            // Hide weapons/armor if soldier
            if (child.name.toLowerCase().includes('weapon') || child.name.toLowerCase().includes('hat')) {
              child.visible = false;
            }
          }
        });

        scene.add(humanModel);
        skeleton = new THREE.SkeletonHelper(humanModel);
        skeleton.visible = false;
        scene.add(skeleton);

        // Map common bones for posing
        bones = {};
        humanModel.traverse(b => {
          if (b.isBone) {
            const name = b.name.toLowerCase();
            if (name.includes('spine') || name.includes('neck') || name.includes('head') || name.includes('arm') || name.includes('leg')) {
              bones[b.name] = b;
            }
          }
        });

        // Intro Animation
        humanModel.scale.set(0.1, 0.1, 0.1);
        gsap.to(humanModel.scale, { x: 1, y: 1, z: 1, duration: 2, ease: "elastic.out(1, 0.75)" });

        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => document.getElementById('loading').remove(), 600);
      }, (xhr) => {
        const p = (xhr.loaded / xhr.total) * 100;
        progressFill.style.width = p + '%';
      });
    }

    loadModel('male');

    // ── Interaction System ──────────────────────────────────────────────
    let currentTool = 'orbit';
    let isDrawing = false;
    let drawPoints = [];
    const drawLineGeo = new THREE.BufferGeometry();
    const drawLineMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 1 });
    const drawLine = new THREE.Line(drawLineGeo, drawLineMat);
    scene.add(drawLine);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

    function handleDrawing(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hit = new THREE.Vector3();
      raycaster.ray.intersectPlane(plane, hit);
      if (drawPoints.length === 0 || hit.distanceTo(drawPoints[drawPoints.length - 1]) > 0.05) {
        drawPoints.push(hit);
        drawLineGeo.setFromPoints(drawPoints);
      }
    }

    function solvePose() {
      if (drawPoints.length < 10) return;
      const curve = new THREE.CatmullRomCurve3(drawPoints);
      const isTopDown = drawPoints[0].y > drawPoints[drawPoints.length - 1].y;

      // Apply to primary bones
      Object.values(bones).forEach(bone => {
        // Get bone height factor
        const worldPos = new THREE.Vector3();
        bone.getWorldPosition(worldPos);
        const t = THREE.MathUtils.clamp(worldPos.y / 2.0, 0, 1);
        const target = curve.getPoint(isTopDown ? 1 - t : t);
        const tangent = curve.getTangent(isTopDown ? 1 - t : t);

        gsap.to(bone.position, {
          x: (target.x - worldPos.x) * 10, // Local offset factor
          duration: 1.2,
          ease: "power2.out"
        });

        // Align bone lookAt
        const lookPos = target.clone().add(tangent);
        gsap.to(bone.rotation, {
          z: -tangent.x * 2,
          duration: 1.2
        });
      });
    }

    canvas.onmousedown = () => { if (currentTool === 'gesture') { isDrawing = true; drawPoints = []; drawLineMat.opacity = 1; } };
    window.onmousemove = (e) => handleDrawing(e);
    window.onmouseup = () => { if (isDrawing) { solvePose(); isDrawing = false; gsap.to(drawLineMat, { opacity: 0, duration: 1 }); } };

    // Tool Switching
    document.getElementById('tool-orbit').onclick = () => { currentTool = 'orbit'; updateUI(); };
    document.getElementById('tool-gesture').onclick = () => { currentTool = 'gesture'; updateUI(); };
    document.getElementById('tool-reset').onclick = () => {
      if (humanModel) {
        humanModel.traverse(b => { if (b.isBone) gsap.to(b.rotation, { x: 0, y: 0, z: 0, duration: 1 }); });
      }
    };

    function updateUI() {
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.id.includes(currentTool)));
      controls.enabled = currentTool === 'orbit';
    }

    // Sidebar Logic
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        const group = btn.parentElement;
        group.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (btn.dataset.gender) {
          studioState.gender = btn.dataset.gender;
          loadModel(btn.dataset.gender);
        }
        if (btn.dataset.mode) {
          studioState.view = btn.dataset.mode;
          if (humanModel) {
            humanModel.traverse(child => {
              if (child.isMesh) {
                if (btn.dataset.mode === 'skeletal') {
                  child.material.transparent = true;
                  child.material.opacity = 0.2;
                  skeleton.visible = true;
                } else {
                  child.material.transparent = false;
                  child.material.opacity = 1;
                  skeleton.visible = false;
                }
              }
            });
          }
        }
      };
    });

    document.getElementById('slider-muscle').oninput = (e) => {
      const v = parseFloat(e.target.value);
      gsap.to(humanModel.scale, { x: 1 + v * 0.1, duration: 0.5 });
      document.getElementById('label-muscle').textContent = Math.round(v * 100) + '%';
    };

    document.getElementById('hide-sidebar-btn').onclick = () => {
      document.getElementById('sidebar').classList.toggle('hidden');
    };

    const tones = ['#f5deb3', '#e8c9a0', '#d4a574', '#c68642', '#8d5524', '#4a2912', '#ffd1dc', '#c084fc'];
    const swatchBox = document.getElementById('skin-swatches');
    tones.forEach(t => {
      const sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = t;
      sw.onclick = () => {
        studioState.skinColor = t;
        if (humanModel) {
          humanModel.traverse(c => { if (c.isMesh) gsap.to(c.material.color, { ...new THREE.Color(t), duration: 0.6 }); });
        }
        swatchBox.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
      };
      swatchBox.appendChild(sw);
    });

    // ── Loop ────────────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.onresize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };

  </script>
</body>

</html>
