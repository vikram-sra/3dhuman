<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AnatomyPro 5.0 - Organic Lab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #030305;
      --panel-bg: rgba(10, 10, 18, 0.75);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.5);
      --text: #ffffff;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #c {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      cursor: crosshair;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .brand {
      pointer-events: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      padding: 12px 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-size: 10px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 800;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      width: 280px;
      background: var(--panel-bg);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      pointer-events: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      z-index: 100;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar.hidden {
      transform: translateY(-50%) translateX(320px);
      opacity: 0;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .toggle-group {
      display: flex;
      background: var(--glass);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .toggle-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      appearance: none;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
    }

    .value-display {
      font-size: 11px;
      color: var(--text-dim);
      min-width: 24px;
      text-align: right;
    }

    .primary-btn {
      background: white;
      color: black;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
    }

    /* Toolbar */
    .toolbar {
      position: fixed;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
    }

    .tool-btn {
      width: 52px;
      height: 52px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.3s;
    }

    .tool-btn:hover {
      color: white;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .tool-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    #status-tip {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 12px;
      color: var(--text-dim);
      border: 1px solid var(--border);
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #status-tip.visible {
      opacity: 1;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .color-swatch {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-swatch.active {
      border-color: white;
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="spinner"></div>
    <p
      style="margin-top: 20px; font-size: 13px; font-weight: 600; font-family: monospace; letter-spacing: 0.2em; text-transform: uppercase;">
      Synthesizing Body Mass...</p>
  </div>

  <canvas id="c"></canvas>

  <div class="overlay">
    <div class="brand">
      <h1>AnatomyPro</h1>
      <span>v5.0 Organic</span>
    </div>

    <div class="toolbar">
      <div class="tool-btn active" id="tool-orbit" title="Orbit Mode">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
          <path d="M2 12h20" />
        </svg>
      </div>
      <div class="tool-btn" id="tool-draw" title="Gesture Draw">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 19l7-7 3 3-7 7-3-3z" />
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
          <path d="M2 2l5 5" />
        </svg>
      </div>
      <div class="tool-btn" id="tool-reset" title="Reset Frame">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      </div>
    </div>

    <div class="sidebar" id="sidebar">
      <div class="control-section">
        <div class="section-title">Gender Morph</div>
        <div class="toggle-group">
          <button class="toggle-btn active" data-gender="male">Male</button>
          <button class="toggle-btn" data-gender="female">Female</button>
        </div>
      </div>

      <div class="control-section">
        <div class="section-title">View Mode</div>
        <div class="toggle-group">
          <button class="toggle-btn active" data-mode="skin">Skin</button>
          <button class="toggle-btn" data-mode="xray">X-Ray</button>
          <button class="toggle-btn" data-mode="muscle">Muscle</button>
        </div>
      </div>

      <div class="control-section">
        <div class="section-title">Anatomy Scale</div>
        <div class="control-item">
          <div class="slider-container">
            <input type="range" id="param-mass" min="0" max="1" step="0.01" value="0.5">
            <span class="value-display" id="val-mass">50%</span>
          </div>
        </div>
      </div>

      <div class="control-section">
        <div class="section-title">Lighting</div>
        <div class="control-item">
          <div class="slider-container">
            <input type="range" id="param-light" min="0" max="1" step="0.01" value="0.4">
          </div>
        </div>
      </div>

      <button class="primary-btn" id="hide-sidebar-btn">
        Focus Canvas
      </button>
    </div>

    <div id="status-tip">Draw a curve to gesture the organic mass</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.2/index.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
    import gsap from 'gsap';

    // ── Setup ────────────────────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 4.5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1, 0);

    // ── Environments ──────────────────────────────────────────────────────
    const ambient = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambient);

    const mainLight = new THREE.PointLight(0xffffff, 20, 10);
    mainLight.position.set(2, 3, 2);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const rimLight = new THREE.SpotLight(0x6366f1, 40, 10, 0.5);
    rimLight.position.set(-3, 2, -3);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(20, 40, 0x222222, 0x111111);
    scene.add(grid);

    // ── Organic Engine (Marching Cubes) ──────────────────────────────────
    const skinMat = new THREE.MeshStandardMaterial({
      color: 0xe8c9a0, roughness: 0.35, metalness: 0.05,
      emissive: 0x221111, emissiveIntensity: 0.1
    });

    const xrayMat = new THREE.MeshPhysicalMaterial({
      color: 0x6366f1, metalness: 1, roughness: 0.1,
      transparent: true, opacity: 0.4, transmission: 0.9,
      thickness: 1, emissive: 0x6366f1, emissiveIntensity: 0.5
    });

    const muscleMat = new THREE.MeshStandardMaterial({
      color: 0xaa2222, roughness: 0.5, metalness: 0.1,
      emissive: 0x330000, emissiveIntensity: 0.2
    });

    const resolution = 54;
    const body = new MarchingCubes(resolution, skinMat, true, true, 100000);
    body.scale.set(1.4, 2.2, 1.4);
    body.position.y = 1.05;
    scene.add(body);

    const anatomy = {
      joints: [],
      currentGender: 'male',
      mode: 'skin',
      mass: 0.5
    };

    function initSkeleton() {
      // 8-head proportional system joints
      const setup = [
        { id: 'head', pos: [0, 1.72, 0], s: 0.45 },
        { id: 'neck', pos: [0, 1.58, 0], s: 0.35 },
        { id: 'chest', pos: [0, 1.35, 0], s: 0.65 },
        { id: 'abs', pos: [0, 1.1, 0], s: 0.55 },
        { id: 'hips', pos: [0, 0.85, 0], s: 0.6 },

        { id: 'shL', pos: [-0.3, 1.5, 0], s: 0.35 },
        { id: 'elL', pos: [-0.35, 1.25, 0], s: 0.28 },
        { id: 'wrL', pos: [-0.4, 1.0, 0], s: 0.2 },

        { id: 'shR', pos: [0.3, 1.5, 0], s: 0.35 },
        { id: 'elR', pos: [0.3, 1.25, 0], s: 0.28 },
        { id: 'wrR', pos: [0.35, 1.0, 0], s: 0.2 },

        { id: 'hpL', pos: [-0.18, 0.8, 0], s: 0.48 },
        { id: 'knL', pos: [-0.18, 0.4, 0], s: 0.38 },
        { id: 'anL', pos: [-0.18, 0.05, 0], s: 0.28 },

        { id: 'hpR', pos: [0.18, 0.8, 0], s: 0.48 },
        { id: 'knR', pos: [0.18, 0.4, 0], s: 0.38 },
        { id: 'anR', pos: [0.18, 0.05, 0], s: 0.28 }
      ];

      anatomy.joints = setup.map(s => ({
        id: s.id,
        pos: new THREE.Vector3(...s.pos),
        strength: s.s
      }));
    }

    initSkeleton();

    function renderBody() {
      body.reset();
      const p = anatomy;

      p.joints.forEach(j => {
        // Map to world space of MarchingCubes cube (-1 to 1)
        const x = (j.pos.x / 1.4) + 0.5;
        const y = (j.pos.y / 2.2) + 0.1;
        const z = (j.pos.z / 1.4) + 0.5;

        let strength = j.strength * (0.5 + p.mass);

        // Gender morphing logic
        if (p.currentGender === 'female') {
          if (j.id.includes('hp')) strength *= 1.35;
          if (j.id.includes('sh')) strength *= 0.85;
          if (j.id === 'chest') strength *= 0.7; // Tapered chest
        } else {
          if (j.id.includes('sh')) strength *= 1.25;
          if (j.id.includes('chest')) strength *= 1.1;
        }

        body.addBall(x, y, z, strength, 8);
      });
    }

    // ── Interaction System ─────────────────────────────────────────────
    let isDrawing = false;
    let drawPoints = [];
    const drawLineGeo = new THREE.BufferGeometry();
    const drawLineMat = new THREE.LineBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 1 });
    const drawLine = new THREE.Line(drawLineGeo, drawLineMat);
    scene.add(drawLine);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

    function handleDraw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hit = new THREE.Vector3();
      raycaster.ray.intersectPlane(plane, hit);
      if (drawPoints.length === 0 || hit.distanceTo(drawPoints[drawPoints.length - 1]) > 0.05) {
        drawPoints.push(hit);
        drawLineGeo.setFromPoints(drawPoints);
      }
    }

    function applyPosture() {
      if (drawPoints.length < 5) return;
      const curve = new THREE.CatmullRomCurve3(drawPoints);
      const isTopDown = drawPoints[0].y > drawPoints[drawPoints.length - 1].y;

      anatomy.joints.forEach(j => {
        const t = THREE.MathUtils.clamp(j.pos.y / 1.8, 0, 1);
        const target = curve.getPoint(isTopDown ? 1 - t : t);
        gsap.to(j.pos, { x: target.x, y: target.y, z: target.z, duration: 1.2, ease: "elastic.out(1, 0.8)" });
      });
    }

    // Tooling
    let currentTool = 'orbit';
    document.getElementById('tool-orbit').onclick = () => { currentTool = 'orbit'; updateUI(); };
    document.getElementById('tool-draw').onclick = () => { currentTool = 'draw'; updateUI(); };
    document.getElementById('tool-reset').onclick = () => { resetFrame(); };

    function updateUI() {
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.id.includes(currentTool)));
      document.getElementById('status-tip').classList.toggle('visible', currentTool === 'draw');
      controls.enabled = currentTool === 'orbit';
    }

    canvas.onmousedown = (e) => { if (currentTool === 'draw') { isDrawing = true; drawPoints = []; drawLineMat.opacity = 1; } };
    window.onmousemove = (e) => handleDraw(e);
    window.onmouseup = () => { if (isDrawing) { applyPosture(); isDrawing = false; gsap.to(drawLineMat, { opacity: 0, duration: 1 }); } };

    function resetFrame() {
      const base = [
        [0, 1.72, 0], [0, 1.58, 0], [0, 1.35, 0], [0, 1.1, 0], [0, 0.85, 0],
        [-0.3, 1.5, 0], [-0.35, 1.25, 0], [-0.4, 1.0, 0],
        [0.3, 1.5, 0], [0.3, 1.25, 0], [0.35, 1.0, 0],
        [-0.18, 0.8, 0], [-0.18, 0.4, 0], [-0.18, 0.05, 0],
        [0.18, 0.8, 0], [0.18, 0.4, 0], [0.18, 0.05, 0]
      ];
      anatomy.joints.forEach((j, i) => gsap.to(j.pos, { x: base[i][0], y: base[i][1], z: base[i][2], duration: 1, ease: "power3.inOut" }));
    }

    // Sidebar
    document.querySelectorAll('.toggle-btn').forEach(b => {
      b.onclick = () => {
        const p = b.parentElement;
        p.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
        if (b.dataset.gender) anatomy.currentGender = b.dataset.gender;
        if (b.dataset.mode) {
          anatomy.mode = b.dataset.mode;
          body.material = b.dataset.mode === 'skin' ? skinMat : (b.dataset.mode === 'xray' ? xrayMat : muscleMat);
        }
      };
    });

    document.getElementById('param-mass').oninput = (e) => {
      anatomy.mass = parseFloat(e.target.value);
      document.getElementById('val-mass').textContent = Math.round(e.target.value * 100) + '%';
    };

    document.getElementById('param-light').oninput = (e) => {
      mainLight.intensity = e.target.value * 40;
    };

    document.getElementById('hide-sidebar-btn').onclick = () => {
      document.getElementById('sidebar').classList.toggle('hidden');
    };

    // ── Loop ────────────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      renderBody();
      controls.update();
      renderer.render(scene, camera);
    }

    window.onresize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };

    setTimeout(() => {
      document.getElementById('loading').style.opacity = '0';
      setTimeout(() => document.getElementById('loading').remove(), 500);
      animate();
    }, 1500);

  </script>
</body>

</html>
