<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AnatomyPro - 3D Human Gesture Lab</title>

  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #030303;
      --panel-bg: rgba(10, 10, 15, 0.7);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.5);
      --text: #ffffff;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --glass: rgba(255, 255, 255, 0.03);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    /* Fullscreen Canvas */
    #c {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      cursor: crosshair;
    }

    /* Modern UI Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .brand {
      pointer-events: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      padding: 12px 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    /* Control Sidebar */
    .sidebar {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      width: 280px;
      background: var(--panel-bg);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      pointer-events: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      z-index: 100;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar.hidden {
      transform: translateY(-50%) translateX(320px);
      opacity: 0;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    /* Toggle Switches */
    .toggle-group {
      display: flex;
      background: var(--glass);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .toggle-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Master Controls */
    .control-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      appearance: none;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .value-display {
      font-size: 12px;
      color: var(--text-dim);
      min-width: 24px;
      text-align: right;
    }

    /* Action Buttons */
    .primary-btn {
      background: white;
      color: black;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary-btn:hover {
      background: #f0f0f0;
      transform: translateY(-2px);
    }

    .primary-btn.active {
      background: var(--accent);
      color: white;
    }

    .secondary-btn {
      background: var(--glass);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    /* Color Swatches */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .color-swatch {
      aspect-ratio: 1;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .color-swatch.active {
      border-color: white;
    }

    /* Status Tooltip */
    #status-tip {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 12px;
      color: var(--text-dim);
      border: 1px solid var(--border);
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #status-tip.visible {
      opacity: 1;
    }

    /* Toolbar */
    .toolbar {
      position: fixed;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
    }

    .tool-btn {
      width: 52px;
      height: 52px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.3s;
    }

    .tool-btn:hover {
      color: white;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .tool-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* Mobile Adaptivity */
    @media (max-width: 768px) {
      .sidebar {
        bottom: 24px;
        top: auto;
        transform: none;
        width: calc(100% - 48px);
        left: 24px;
      }

      .sidebar.hidden {
        transform: translateY(150%);
      }

      .toolbar {
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        flex-direction: row;
      }
    }

    #loading {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 20px; font-size: 14px; font-weight: 500;">Initializing Anatomy Engine...</p>
  </div>

  <canvas id="c"></canvas>

  <div class="overlay">
    <div class="top-bar">
      <div class="brand">
        <h1>AnatomyPro</h1>
        <span>Gen 4.0</span>
      </div>
    </div>

    <div class="toolbar">
      <div class="tool-btn active" id="tool-orbit" title="Orbit Camera">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
          <path d="M2 12h20" />
        </svg>
      </div>
      <div class="tool-btn" id="tool-draw" title="Draw Gesture S-Curve">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m12 19 7-7 3 3-7 7-3-3Z" />
          <path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5Z" />
          <path d="m2 2 5 5" />
          <path d="m8.5 8.5 1 1" />
        </svg>
      </div>
      <div class="tool-btn" id="tool-reset" title="Reset Pose">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      </div>
    </div>

    <div class="sidebar" id="sidebar">
      <div class="control-section">
        <div class="section-title">Anatomy Preset</div>
        <div class="toggle-group">
          <button class="toggle-btn active" data-gender="male">Male</button>
          <button class="toggle-btn" data-gender="female">Female</button>
        </div>
      </div>

      <div class="control-section">
        <div class="section-title">Appearance</div>
        <div class="color-grid" id="color-grid"></div>
      </div>

      <div class="control-section">
        <div class="section-title">Musculature</div>
        <div class="control-item">
          <div class="slider-container">
            <input type="range" id="param-muscle" min="0" max="1" step="0.01" value="0.5">
            <span class="value-display" id="val-muscle">50%</span>
          </div>
        </div>
      </div>

      <div class="control-section">
        <div class="section-title">Atmosphere</div>
        <div class="control-item">
          <span style="font-size: 12px; color: var(--text-dim);">Exposure</span>
          <div class="slider-container">
            <input type="range" id="param-light" min="0" max="4" step="0.1" value="1.5">
          </div>
        </div>
      </div>

      <button class="primary-btn" id="hide-sidebar-btn">
        Optimize View
      </button>
    </div>

    <div id="status-tip">
      Hold SPACE and Draw an S-curve to deform the body
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.2/index.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import gsap from 'gsap';

    // ── Setup ────────────────────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.1, 0);

    // ── Environments ──────────────────────────────────────────────────────
    const ambient = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambient);

    const mainLight = new THREE.PointLight(0xffffff, 15, 20);
    mainLight.position.set(3, 3, 4);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.set(1024, 1024);
    scene.add(mainLight);

    const rimLight = new THREE.SpotLight(0x88aaff, 30, 10, 0.4);
    rimLight.position.set(-3, 2, -4);
    scene.add(rimLight);

    // Modern Grid
    const grid = new THREE.GridHelper(20, 40, 0x333333, 0x151515);
    grid.position.y = -0.01;
    scene.add(grid);

    // ── Realistic Human Engine ───────────────────────────────────────────
    // We use a high-fidelity capsule-based approach with morphable joints

    const skinMaterial = new THREE.MeshStandardMaterial({
      color: 0xd4a574,
      roughness: 0.4,
      metalness: 0.05,
      // Fake SSS using emissive or rim
      emissive: 0x221111,
      emissiveIntensity: 0.2
    });

    const bodyParts = new THREE.Group();
    scene.add(bodyParts);

    // Geometry Factory
    const createCapsule = (radius, length) => {
      const geo = new THREE.CapsuleGeometry(radius, length, 10, 20);
      return new THREE.Mesh(geo, skinMaterial);
    };

    const anatomy = {
      spine: [],
      limbs: {},
      genderProps: {
        male: { shoulders: 0.6, hips: 0.35, chest: 0.35, height: 1.0 },
        female: { shoulders: 0.4, hips: 0.5, chest: 0.28, height: 0.95 }
      },
      currentGender: 'male'
    };

    function buildAnatomy() {
      // Spine Segments (Hips to Head)
      const segments = 5;
      const segLen = 0.15;
      for (let i = 0; i < segments; i++) {
        const seg = createCapsule(0.12, segLen);
        seg.position.y = 0.7 + i * (segLen + 0.05);
        seg.castShadow = true;
        bodyParts.add(seg);
        anatomy.spine.push(seg);
      }

      // Head
      const head = createCapsule(0.12, 0.15);
      head.position.y = 1.9;
      head.castShadow = true;
      bodyParts.add(head);
      anatomy.limbs.head = head;

      // Shoulders
      const shoulders = createCapsule(0.1, 0.5); // Width determined by gender
      shoulders.rotation.z = Math.PI / 2;
      shoulders.position.y = 1.7;
      bodyParts.add(shoulders);
      anatomy.limbs.shoulders = shoulders;

      // Limbs (Arms & Legs)
      const createLimb = (name, x, y, len, radius) => {
        const upper = createCapsule(radius, len);
        const lower = createCapsule(radius * 0.8, len);
        upper.position.set(x, y, 0);
        lower.position.set(x, y - len, 0);
        bodyParts.add(upper);
        bodyParts.add(lower);
        anatomy.limbs[name] = { upper, lower };
      };

      createLimb('armL', -0.3, 1.5, 0.35, 0.05);
      createLimb('armR', 0.3, 1.5, 0.35, 0.05);
      createLimb('legL', -0.15, 0.5, 0.45, 0.07);
      createLimb('legR', 0.15, 0.5, 0.45, 0.07);
    }

    buildAnatomy();

    // Reset Pose
    function resetPose() {
      const segLen = 0.15;
      anatomy.spine.forEach((seg, i) => {
        gsap.to(seg.position, { y: 0.7 + i * (segLen + 0.05), x: 0, z: 0, duration: 1, ease: "power3.out" });
        gsap.to(seg.rotation, { x: 0, y: 0, z: 0, duration: 1 });
      });

      // Reset Limbs
      const props = anatomy.genderProps[anatomy.currentGender];
      gsap.to(anatomy.limbs.head.position, { y: 1.85, x: 0, z: 0, duration: 1 });
      gsap.to(anatomy.limbs.shoulders.position, { y: 1.7, x: 0, z: 0, duration: 1 });
      gsap.to(anatomy.limbs.shoulders.scale, { x: 1, duration: 1 });

      const resetL = (limb, x, y, len) => {
        gsap.to(limb.upper.position, { x, y, z: 0, duration: 1 });
        gsap.to(limb.lower.position, { x, y: y - len - 0.1, z: 0, duration: 1 });
        gsap.to(limb.upper.rotation, { x: 0, y: 0, z: 0, duration: 1 });
        gsap.to(limb.lower.rotation, { x: 0, y: 0, z: 0, duration: 1 });
      };

      resetL(anatomy.limbs.armL, -props.shoulders / 2, 1.5, 0.35);
      resetL(anatomy.limbs.armR, props.shoulders / 2, 1.5, 0.35);
      resetL(anatomy.limbs.legL, -0.15, 0.5, 0.45);
      resetL(anatomy.limbs.legR, 0.15, 0.5, 0.45);
    }

    // ── Gesture Lab (S-Curve Magic) ────────────────────────────────────
    let isDrawing = false;
    let drawPoints = [];
    const drawLineGeo = new THREE.BufferGeometry();
    const drawLineMat = new THREE.LineBasicMaterial({ color: 0x6366f1, linewidth: 3 });
    const drawLine = new THREE.Line(drawLineGeo, drawLineMat);
    scene.add(drawLine);

    const ghostMaterial = new THREE.MeshBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.2 });
    const suggestions = new THREE.Group();
    scene.add(suggestions);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const drawingPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

    function startDrawing(e) {
      isDrawing = true;
      drawPoints = [];
      suggestions.clear();
      updateDraw(e);
      controls.enabled = false;
    }

    function updateDraw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersect = new THREE.Vector3();
      raycaster.ray.intersectPlane(drawingPlane, intersect);

      drawPoints.push(intersect);
      if (drawPoints.length > 2) {
        drawLineGeo.setFromPoints(drawPoints);
        suggestPosture();
      }
    }

    function endDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      controls.enabled = true;
      applyPosture();

      // Fade out draw line
      gsap.to(drawLineMat, {
        opacity: 0, duration: 0.5, onComplete: () => {
          drawLineGeo.setFromPoints([]);
          drawLineMat.opacity = 1;
        }
      });
    }

    function suggestPosture() {
      if (drawPoints.length < 5) return;
      suggestions.clear();

      const curve = new THREE.CatmullRomCurve3(drawPoints);
      const segments = 10;
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const pos = curve.getPoint(t);
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.02), ghostMaterial);
        dot.position.copy(pos);
        suggestions.add(dot);
      }
    }

    function applyPosture() {
      if (drawPoints.length < 5) return;
      const curve = new THREE.CatmullRomCurve3(drawPoints);

      // Align Spine
      anatomy.spine.forEach((seg, i) => {
        const t = (i / (anatomy.spine.length - 1)) * 0.6 + 0.2; // Sample middle of curve
        const pos = curve.getPoint(t);
        const tangent = curve.getTangent(t);

        gsap.to(seg.position, { x: pos.x, y: pos.y, z: pos.z, duration: 0.8, ease: "back.out(1.2)" });

        // Alignment rotation
        const lookAt = pos.clone().add(tangent);
        seg.lookAt(lookAt);
        seg.rotateX(Math.PI / 2);
      });

      // Align Head
      const headPos = curve.getPoint(0.9);
      gsap.to(anatomy.limbs.head.position, { x: headPos.x, y: headPos.y, z: headPos.z, duration: 0.8 });

      // Align Shoulders
      const shoulderPos = curve.getPoint(0.75);
      gsap.to(anatomy.limbs.shoulders.position, { x: shoulderPos.x, y: shoulderPos.y, z: shoulderPos.z, duration: 0.8 });

      // Dynamically suggest limb spread based on curve width
      const width = Math.abs(drawPoints[0].x - drawPoints[drawPoints.length - 1].x);
      const intensity = Math.min(width * 2, 1.5);

      const p = anatomy.genderProps[anatomy.currentGender];

      gsap.to(anatomy.limbs.armL.upper.rotation, { z: intensity, duration: 1 });
      gsap.to(anatomy.limbs.armR.upper.rotation, { z: -intensity, duration: 1 });
      gsap.to(anatomy.limbs.legL.upper.rotation, { z: intensity * 0.5, duration: 1 });
      gsap.to(anatomy.limbs.legR.upper.rotation, { z: -intensity * 0.5, duration: 1 });
    }

    // ── Interaction Logic ──────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Tool Switching
    let currentTool = 'orbit';
    document.getElementById('tool-orbit').onclick = () => switchTool('orbit');
    document.getElementById('tool-draw').onclick = () => switchTool('draw');
    document.getElementById('tool-reset').onclick = () => { resetPose(); switchTool('orbit'); };

    function switchTool(t) {
      currentTool = t;
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tool-' + t).classList.add('active');

      const tip = document.getElementById('status-tip');
      if (t === 'draw') {
        tip.textContent = "Click and Drag to draw an S-curve for the gesture";
        tip.classList.add('visible');
      } else {
        tip.classList.remove('visible');
      }
    }

    canvas.addEventListener('mousedown', (e) => { if (currentTool === 'draw') startDrawing(e); });
    window.addEventListener('mousemove', (e) => { if (isDrawing) updateDraw(e); });
    window.addEventListener('mouseup', endDrawing);

    // Gender Toggle
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const gender = btn.dataset.gender;
        anatomy.currentGender = gender;
        morphTo(gender);
      };
    });

    function morphTo(gender) {
      const p = anatomy.genderProps[gender];

      // Shoulders
      gsap.to(anatomy.limbs.shoulders.scale, { x: p.shoulders / 0.5, duration: 1, ease: "power2.inOut" });

      // Hips (Spine segments scale)
      anatomy.spine.forEach((seg, i) => {
        if (i < 2) { // Hips
          gsap.to(seg.scale, { x: p.hips / 0.12, z: p.hips / 0.12, duration: 1 });
        } else if (i === 3) { // Chest
          gsap.to(seg.scale, { x: p.chest / 0.12, z: p.chest / 0.12, duration: 1 });
        }
      });

      // Update Limb Positions
      gsap.to(anatomy.limbs.armL.upper.position, { x: -p.shoulders / 2, duration: 1 });
      gsap.to(anatomy.limbs.armR.upper.position, { x: p.shoulders / 2, duration: 1 });

      // Color adjustment for gender vibe
      gsap.to(skinMaterial.color, {
        r: gender === 'female' ? 0.95 : 0.83,
        g: gender === 'female' ? 0.85 : 0.78,
        b: gender === 'female' ? 0.75 : 0.65,
        duration: 1
      });
    }

    // Colors
    const colors = ['#f5deb3', '#e8c9a0', '#d4a574', '#c68642', '#8d5524', '#4a2912', '#ffa07a', '#7b68ee', '#20b2aa', '#ffffff'];
    const colorGrid = document.getElementById('color-grid');
    colors.forEach(c => {
      const div = document.createElement('div');
      div.className = 'color-swatch';
      div.style.background = c;
      div.onclick = () => {
        gsap.to(skinMaterial.color, { ...new THREE.Color(c), duration: 0.5 });
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        div.classList.add('active');
      };
      colorGrid.appendChild(div);
    });

    // UI Sliders
    document.getElementById('param-muscle').oninput = (e) => {
      const v = e.target.value;
      document.getElementById('val-muscle').textContent = Math.round(v * 100) + '%';
      bodyParts.scale.set(1 + v * 0.1, 1, 1 + v * 0.1); // Simple bulk morph
    };

    document.getElementById('param-light').oninput = (e) => {
      mainLight.intensity = e.target.value * 10;
    };

    document.getElementById('hide-sidebar-btn').onclick = () => {
      document.getElementById('sidebar').classList.toggle('hidden');
    };

    // ── Loop ────────────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);

      if (!isDrawing) {
        // Subtle breathing animation
        const t = performance.now() * 0.001;
        anatomy.spine[3].scale.z = 1 + Math.sin(t) * 0.02;
        anatomy.limbs.shoulders.position.y += Math.sin(t) * 0.0005;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // Final Init
    setTimeout(() => {
      document.getElementById('loading').style.opacity = '0';
      setTimeout(() => document.getElementById('loading').remove(), 500);
      animate();
    }, 1200);

  </script>
</body>

</html>
