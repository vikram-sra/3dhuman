<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AnatomyPro – Organic Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --panel: rgba(8, 8, 14, 0.88);
      --accent: #a78bfa;
      --glow: rgba(167, 139, 250, 0.35);
      --border: rgba(255, 255, 255, 0.09);
      --dim: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--bg);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      width: 300px;
      background: var(--panel);
      backdrop-filter: blur(40px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 32px 80px rgba(0, 0, 0, .7);
      transition: .5s cubic-bezier(.16, 1, .3, 1);
    }

    #sidebar.away {
      transform: translateY(-50%) translateX(360px);
      opacity: 0;
    }

    .logo {
      margin-bottom: 4px;
    }

    .logo h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .logo small {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .row-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--dim);
      margin-bottom: 8px;
    }

    .seg {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pills {
      display: flex;
      gap: 6px;
    }

    .pill {
      flex: 1;
      padding: 11px 6px;
      text-align: center;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: transparent;
      color: var(--dim);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .pill.on {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 18px var(--glow);
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, .1);
      border-radius: 4px;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent);
      cursor: pointer;
    }

    .swatch-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sw {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: .2s;
    }

    .sw.on {
      border-color: #fff;
      transform: scale(1.12);
    }

    .btn {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover {
      background: #e0e0ff;
      transform: translateY(-2px);
    }

    /* ── Toolbar ── */
    #toolbar {
      position: fixed;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tb {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(20px);
      color: var(--dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: .25s;
    }

    .tb:hover {
      color: #fff;
    }

    .tb.on {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 24px var(--glow);
    }

    /* ── Tip ── */
    #tip {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .8);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 12px 24px;
      font-size: 12px;
      color: var(--dim);
      pointer-events: none;
      opacity: 0;
      transition: .3s;
    }

    #tip.show {
      opacity: 1;
    }

    /* ── Loader ── */
    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, .08);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="loader">
    <div class="ring"></div>
    <p style="letter-spacing:.25em;text-transform:uppercase;font-size:11px;font-weight:700;">Building Organic Form</p>
  </div>

  <canvas id="c"></canvas>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="logo">
      <h1>AnatomyPro</h1><small>Organic Bio-Engine</small>
    </div>

    <div class="seg">
      <div class="row-label"><span>PHENOTYPE</span></div>
      <div class="pills" id="gpills">
        <button class="pill on" data-g="male">Male</button>
        <button class="pill" data-g="female">Female</button>
      </div>
    </div>

    <div class="seg">
      <div class="row-label"><span>VIEW MODE</span></div>
      <div class="pills" id="vpills">
        <button class="pill on" data-v="soft">Dermal</button>
        <button class="pill" data-v="muscle">Muscle</button>
        <button class="pill" data-v="xray">X-Ray</button>
      </div>
    </div>

    <div class="seg">
      <div class="row-label"><span>MUSCLE MASS</span><span id="lM">50%</span></div>
      <input type="range" id="slM" min="0" max="100" value="50">
    </div>

    <div class="seg">
      <div class="row-label"><span>BODY FAT</span><span id="lF">20%</span></div>
      <input type="range" id="slF" min="0" max="100" value="20">
    </div>

    <div class="seg">
      <div class="row-label"><span>WAVE INTENSITY</span><span id="lW">40%</span></div>
      <input type="range" id="slW" min="0" max="100" value="40">
    </div>

    <div class="seg">
      <div class="row-label"><span>SKINTONE</span></div>
      <div class="swatch-row" id="swatches"></div>
    </div>

    <button class="btn" id="btnSide">Maximize Canvas</button>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <div class="tb on" id="tbOrbit">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
        <path d="M2 12h20" />
      </svg>
    </div>
    <div class="tb" id="tbPose">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="m12 19 7-7 3 3-7 7-3-3z" />
        <path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
        <path d="M2 2l5 5" />
      </svg>
    </div>
    <div class="tb" id="tbReset">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
    </div>
  </div>

  <div id="tip">Draw a curve across the figure to fluidly reshape the pose</div>

  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.2/index.js"
  }
}
</script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import gsap from 'gsap';

    // ────────────────────────────────────────────────────────────────────────────
    // RENDERER / SCENE / CAMERA
    // ────────────────────────────────────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const W = () => window.innerWidth, H = () => window.innerHeight;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(W(), H());
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.04);

    const camera = new THREE.PerspectiveCamera(38, W() / H(), 0.1, 80);
    camera.position.set(0, 1.45, 4.6);

    const ctrl = new OrbitControls(camera, renderer.domElement);
    ctrl.enableDamping = true;
    ctrl.dampingFactor = 0.05;
    ctrl.target.set(0, 1.1, 0);

    // ────────────────────────────────────────────────────────────────────────────
    // LIGHTS
    // ────────────────────────────────────────────────────────────────────────────
    const amb = new THREE.AmbientLight(0xffffff, 0.3); scene.add(amb);

    const key = new THREE.SpotLight(0xfff4e0, 120, 20, 0.5, 0.6);
    key.position.set(4, 6, 4); key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048); scene.add(key);

    const fill = new THREE.PointLight(0x6366f1, 40, 12);
    fill.position.set(-4, 1.5, 2); scene.add(fill);

    const rim = new THREE.SpotLight(0xa78bfa, 100, 20, 0.4);
    rim.position.set(-1, 5, -6); scene.add(rim);

    // Floor
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(12, 64),
      new THREE.MeshStandardMaterial({ color: 0x080810, roughness: 0.1, metalness: 0.6 })
    );
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

    const grid = new THREE.GridHelper(24, 50, 0x0d0d14, 0x0a0a10);
    grid.position.y = 0.001; scene.add(grid);

    // ────────────────────────────────────────────────────────────────────────────
    // MATERIALS
    // ────────────────────────────────────────────────────────────────────────────
    const skinMat = new THREE.MeshPhysicalMaterial({
      color: 0xd4a574, roughness: 0.3, metalness: 0.05,
      clearcoat: 0.2, clearcoatRoughness: 0.4,
      sheen: 0.6, sheenColor: 0xffdbb0, sheenRoughness: 0.5,
      emissive: 0x150a05, emissiveIntensity: 0.12
    });

    const muscleMat = new THREE.MeshStandardMaterial({
      color: 0x991b1b, roughness: 0.4, metalness: 0.2,
      emissive: 0x3d0000, emissiveIntensity: 0.3
    });

    const xrayMat = new THREE.MeshPhysicalMaterial({
      color: 0xa78bfa, transparent: true, opacity: 0.35,
      metalness: 1, roughness: 0, transmission: 0.9,
      emissive: 0xa78bfa, emissiveIntensity: 0.8
    });

    let activeMat = skinMat;

    // ────────────────────────────────────────────────────────────────────────────
    // ORGANIC LATHE BUILDER — creates fluid silhouette segments
    // ────────────────────────────────────────────────────────────────────────────
    function lathe(profile2D, segs = 48) {
      // profile2D = [{x, y}, ...] in local space
      const pts = profile2D.map(p => new THREE.Vector2(p.x, p.y));
      const geo = new THREE.LatheGeometry(pts, segs);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, activeMat);
      mesh.castShadow = true; mesh.receiveShadow = true;
      return mesh;
    }

    function capsuleSmooth(radiusTop, radiusBot, height, segs = 48) {
      // Creates a smooth barrel/capsule between two radii using LatheGeometry
      const steps = 18;
      const pts = [];
      // Top dome
      for (let i = steps; i >= 0; i--) {
        const a = (i / steps) * (Math.PI / 2);
        pts.push({ x: radiusTop * Math.sin(a), y: height / 2 + radiusTop * Math.cos(a) });
      }
      // Waist taper
      pts.push({ x: radiusBot * 1, y: height / 2 });
      pts.push({ x: radiusBot, y: -height / 2 });
      // Bottom dome
      for (let i = 0; i <= steps; i++) {
        const a = (i / steps) * (Math.PI / 2);
        pts.push({ x: radiusBot * Math.sin(a), y: -height / 2 - radiusBot * Math.cos(a) });
      }
      return lathe(pts, segs);
    }

    // ────────────────────────────────────────────────────────────────────────────
    // STATE
    // ────────────────────────────────────────────────────────────────────────────
    const state = {
      gender: 'male', view: 'soft',
      muscle: 0.5, fat: 0.2, wave: 0.4,
      skinColor: new THREE.Color(0xd4a574),
      time: 0
    };

    const human = new THREE.Group();
    scene.add(human);

    // Track all bio-meshes for vertex animation
    const bioMeshes = [];

    // ────────────────────────────────────────────────────────────────────────────
    // BUILD ANATOMY
    // ────────────────────────────────────────────────────────────────────────────
    function buildHuman() {
      human.clear();
      bioMeshes.length = 0;

      const isFemale = state.gender === 'female';
      const m = state.muscle;
      const f = state.fat;

      // Head-unit proportions (8H = 1.8m) 
      const totalH = 1.8;
      const Hu = totalH / 8; // 0.225 per head

      // ── Head ─────────────────────────────────────────────────────────────
      const headR = Hu * 0.48;
      const headGeo = new THREE.SphereGeometry(headR, 48, 48);
      const headM = new THREE.Mesh(headGeo, activeMat);
      headM.position.y = totalH - headR; // ~1.57+
      headM.castShadow = true;
      human.add(headM);
      bioMeshes.push({ mesh: headM, basePos: headM.position.clone(), phase: 0 });

      // Ears (small sphere bumps)
      [-1, 1].forEach(side => {
        const earGeo = new THREE.SphereGeometry(headR * 0.2, 24, 24);
        const ear = new THREE.Mesh(earGeo, activeMat);
        ear.position.set(side * headR * 0.9, totalH - headR * 0.95, 0);
        ear.castShadow = true;
        human.add(ear);
      });

      // ── Neck ─────────────────────────────────────────────────────────────
      const neckR = Hu * 0.22;
      const neckH = Hu * 0.5;
      const neckY = totalH - headR * 2.1;
      const neck = capsuleSmooth(neckR, neckR * 1.15, neckH);
      neck.position.y = neckY;
      human.add(neck);
      bioMeshes.push({ mesh: neck, basePos: neck.position.clone(), phase: 0.5 });

      // ── Torso (Lathe profile — shoulder to hip) ──────────────────────────
      const shoulderW = isFemale ? Hu * 0.9 : Hu * 1.1;
      const waistW = isFemale ? Hu * 0.7 : Hu * 0.75;
      const hipW = isFemale ? Hu * 1.05 : Hu * 0.9;
      const musclePad = m * 0.04;

      const torsoTop = neckY - neckH / 2;
      const torsoBot = Hu * 4.0; // Hip-line
      const torsoH = torsoTop - torsoBot;

      // Lathe profile for torso (from top to bottom, right side)
      const torsoProfile = [
        { x: 0, y: torsoTop + 0.01 },           // neck base
        { x: shoulderW + musclePad, y: torsoTop - Hu * 0.3 },      // shoulder flare
        { x: shoulderW * 0.92 + musclePad, y: torsoTop - Hu * 0.6 },      // chest upper
        { x: shoulderW * 0.88 + musclePad * 1.3, y: torsoTop - Hu * 1.1 },    // chest mid (pec)
        { x: waistW + f * 0.03, y: torsoBot + Hu * 0.9 },      // waist
        { x: waistW + f * 0.04, y: torsoBot + Hu * 0.65 },     // lower waist
        { x: hipW + f * 0.05, y: torsoBot + Hu * 0.2 },      // hip flare
        { x: hipW * 0.9, y: torsoBot },                  // hip base
        { x: 0, y: torsoBot - 0.01 }            // crotch
      ];

      const torso = lathe(torsoProfile, 64);
      torso.castShadow = true;
      human.add(torso);
      bioMeshes.push({ mesh: torso, basePos: torso.position.clone(), phase: 1 });

      // ── Shoulders / Deltoids ─────────────────────────────────────────────
      const shoulderY = torsoTop - Hu * 0.3;
      [-1, 1].forEach(side => {
        const deltR = (Hu * 0.22) + m * 0.04;
        const deltGeo = new THREE.SphereGeometry(deltR, 32, 32);
        const delt = new THREE.Mesh(deltGeo, activeMat);
        delt.position.set(side * (shoulderW + deltR * 0.6 + musclePad), shoulderY, 0);
        delt.castShadow = true;
        human.add(delt);
        bioMeshes.push({ mesh: delt, basePos: delt.position.clone(), phase: side * 0.3 + 0.8 });
      });

      // ── Upper Arms ───────────────────────────────────────────────────────
      const upperArmR = (Hu * 0.16) + m * 0.04;
      const upperArmL = Hu * 1.2;
      [-1, 1].forEach(side => {
        const arm = capsuleSmooth(upperArmR, upperArmR * 0.85, upperArmL);
        const armX = side * (shoulderW + upperArmR * 1.2 + musclePad * 1.2);
        const armTopY = shoulderY - Hu * 0.1;
        arm.position.set(armX, armTopY - upperArmL / 2, 0);
        human.add(arm);
        bioMeshes.push({ mesh: arm, basePos: arm.position.clone(), phase: side * 0.5 + 1.5 });

        // Forearms
        const foreR = (Hu * 0.12) + m * 0.02;
        const foreL = Hu * 1.05;
        const fore = capsuleSmooth(foreR, foreR * 0.8, foreL);
        fore.position.set(armX, armTopY - upperArmL - foreL / 2 - 0.01, 0);
        human.add(fore);
        bioMeshes.push({ mesh: fore, basePos: fore.position.clone(), phase: side * 0.5 + 2 });

        // Hands
        const handGeo = new THREE.SphereGeometry(foreR * 0.9, 24, 24);
        const hand = new THREE.Mesh(handGeo, activeMat);
        hand.position.set(armX, armTopY - upperArmL - foreL - foreR * 0.6, 0);
        hand.castShadow = true;
        human.add(hand);
        bioMeshes.push({ mesh: hand, basePos: hand.position.clone(), phase: side * 0.4 + 2.4 });
      });

      // ── Pelvis / Glutes ──────────────────────────────────────────────────
      const pelvisR = hipW * 0.85 + f * 0.05;
      const pelvisGeo = new THREE.SphereGeometry(pelvisR, 48, 24);
      pelvisGeo.scale(1, 0.55, 0.85);
      const pelvis = new THREE.Mesh(pelvisGeo, activeMat);
      pelvis.position.set(0, torsoBot + Hu * 0.1 - 0.05, isFemale ? -0.015 : 0);
      pelvis.castShadow = true;
      human.add(pelvis);
      bioMeshes.push({ mesh: pelvis, basePos: pelvis.position.clone(), phase: 2 });

      // ── Legs ─────────────────────────────────────────────────────────────
      const thighR = (Hu * 0.26) + m * 0.05 + f * 0.04;
      const thighL = Hu * 1.9;
      const calfR = (Hu * 0.18) + m * 0.03;
      const calfL = Hu * 1.85;
      const legSep = isFemale ? Hu * 0.55 : Hu * 0.42;

      [-1, 1].forEach(side => {
        const thighTopY = torsoBot - 0.02;

        // Thigh
        const thigh = capsuleSmooth(thighR, thighR * 0.8, thighL);
        thigh.position.set(side * legSep, thighTopY - thighL / 2, 0);
        human.add(thigh);
        bioMeshes.push({ mesh: thigh, basePos: thigh.position.clone(), phase: side * 0.3 + 2.8 });

        // Kneecap
        const kneeGeo = new THREE.SphereGeometry(calfR * 1.1, 24, 24);
        const knee = new THREE.Mesh(kneeGeo, activeMat);
        knee.position.set(side * legSep, thighTopY - thighL, 0);
        knee.castShadow = true; human.add(knee);

        // Calf
        const calf = capsuleSmooth(calfR, calfR * 0.7, calfL);
        calf.position.set(side * legSep, thighTopY - thighL - calfL / 2, 0);
        human.add(calf);
        bioMeshes.push({ mesh: calf, basePos: calf.position.clone(), phase: side * 0.3 + 3.4 });

        // Ankle
        const ankleGeo = new THREE.SphereGeometry(calfR * 0.65, 24, 24);
        const ankle = new THREE.Mesh(ankleGeo, activeMat);
        ankle.position.set(side * legSep, thighTopY - thighL - calfL, 0);
        ankle.castShadow = true; human.add(ankle);

        // Foot
        const footGeo = new THREE.CapsuleGeometry(calfR * 0.55, Hu * 0.7, 24, 24);
        const foot = new THREE.Mesh(footGeo, activeMat);
        foot.rotation.x = Math.PI / 2;
        foot.position.set(side * legSep, thighTopY - thighL - calfL - 0.05, 0.06);
        foot.castShadow = true; human.add(foot);
      });

      // Sync material on all objects
      human.traverse(c => { if (c.isMesh) c.material = activeMat; });
    }

    buildHuman();

    // ────────────────────────────────────────────────────────────────────────────
    // VERTEX WAVE ANIMATION  — soft breathing / ripple effect
    // ────────────────────────────────────────────────────────────────────────────
    function animateWave(t) {
      const amp = state.wave * 0.012;
      bioMeshes.forEach(item => {
        const bp = item.basePos;
        const ph = item.phase;
        // Gentle sine oscillation on Y
        item.mesh.position.y = bp.y + Math.sin(t * 1.1 + ph) * amp;
        // Very subtle X sway for breathing feel
        item.mesh.position.x = bp.x + Math.sin(t * 0.6 + ph * 1.3) * amp * 0.4;
        // Scale pulsation — subtle inhale/exhale
        const pulse = 1 + Math.sin(t * 0.9 + ph * 0.7) * amp * 0.3;
        item.mesh.scale.setScalar(pulse);
      });
    }

    // ────────────────────────────────────────────────────────────────────────────
    // GESTURE POSE SYSTEM
    // ────────────────────────────────────────────────────────────────────────────
    let tool = 'orbit';
    let drawing = false;
    let drawPts = [];

    const lineGeo = new THREE.BufferGeometry();
    const lineMat = new THREE.LineBasicMaterial({ color: 0xa78bfa, transparent: true, opacity: 0 });
    const guideLine = new THREE.Line(lineGeo, lineMat);
    scene.add(guideLine);

    const ray = new THREE.Raycaster();
    const mu = new THREE.Vector2();
    const drawPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

    function ptrPos(e) {
      const r = canvas.getBoundingClientRect();
      mu.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      mu.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    }

    canvas.addEventListener('mousedown', e => {
      if (tool !== 'draw') return;
      drawing = true; drawPts = []; lineMat.opacity = 1;
      ptrPos(e); samplePlane();
    });
    canvas.addEventListener('mousemove', e => {
      if (!drawing) return;
      ptrPos(e); samplePlane();
    });
    canvas.addEventListener('mouseup', () => {
      if (!drawing) return;
      drawing = false;
      applyGesture();
      gsap.to(lineMat, { opacity: 0, duration: 1.5 });
    });

    function samplePlane() {
      ray.setFromCamera(mu, camera);
      const hit = new THREE.Vector3();
      ray.ray.intersectPlane(drawPlane, hit);
      if (!hit) return;
      if (drawPts.length === 0 || hit.distanceTo(drawPts[drawPts.length - 1]) > 0.05) {
        drawPts.push(hit.clone());
        lineGeo.setFromPoints(drawPts);
      }
    }

    function applyGesture() {
      if (drawPts.length < 6) return;
      const curve = new THREE.CatmullRomCurve3(drawPts);
      const isTopDown = drawPts[0].y > drawPts[drawPts.length - 1].y;
      const minY = Math.min(...bioMeshes.map(b => b.basePos.y));
      const maxY = Math.max(...bioMeshes.map(b => b.basePos.y));

      bioMeshes.forEach(item => {
        const t = THREE.MathUtils.clamp((item.basePos.y - minY) / (maxY - minY), 0, 1);
        const sample = curve.getPoint(isTopDown ? 1 - t : t);
        gsap.to(item.basePos, {
          x: sample.x,
          y: sample.y,
          z: sample.z ?? 0,
          duration: 1.6,
          ease: 'elastic.out(1, 0.65)'
        });
      });
    }

    function resetPose() {
      human.clear(); bioMeshes.length = 0;
      buildHuman();
      gsap.from(human.scale, { x: 0.8, y: 0.8, z: 0.8, duration: 1.2, ease: 'elastic.out(1, 0.5)' });
    }

    // ────────────────────────────────────────────────────────────────────────────
    // UI BINDINGS
    // ────────────────────────────────────────────────────────────────────────────
    function setTool(t) {
      tool = t;
      document.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.id === 'tb' + t.charAt(0).toUpperCase() + t.slice(1)));
      ctrl.enabled = (t === 'orbit');
      document.getElementById('tip').classList.toggle('show', t === 'draw');
    }

    document.getElementById('tbOrbit').onclick = () => setTool('orbit');
    document.getElementById('tbPose').onclick = () => setTool('draw');
    document.getElementById('tbReset').onclick = () => { resetPose(); setTool('orbit'); };

    // Gender pills
    document.querySelectorAll('#gpills .pill').forEach(p => {
      p.onclick = () => {
        document.querySelectorAll('#gpills .pill').forEach(x => x.classList.remove('on'));
        p.classList.add('on');
        state.gender = p.dataset.g;
        resetPose();
      };
    });

    // View pills
    document.querySelectorAll('#vpills .pill').forEach(p => {
      p.onclick = () => {
        document.querySelectorAll('#vpills .pill').forEach(x => x.classList.remove('on'));
        p.classList.add('on');
        state.view = p.dataset.v;
        activeMat = state.view === 'soft' ? skinMat : (state.view === 'muscle' ? muscleMat : xrayMat);
        human.traverse(c => { if (c.isMesh) c.material = activeMat; });
      };
    });

    // Sliders
    document.getElementById('slM').oninput = e => {
      state.muscle = e.target.value / 100;
      document.getElementById('lM').textContent = e.target.value + '%';
      resetPose();
    };
    document.getElementById('slF').oninput = e => {
      state.fat = e.target.value / 100;
      document.getElementById('lF').textContent = e.target.value + '%';
      resetPose();
    };
    document.getElementById('slW').oninput = e => {
      state.wave = e.target.value / 100;
      document.getElementById('lW').textContent = e.target.value + '%';
    };

    // Skintone swatches
    const tones = ['#f5deb3', '#e8c9a0', '#d4a574', '#c68642', '#8d5524', '#4a2912', '#ffa07a', '#dda0dd'];
    tones.forEach(t => {
      const sw = document.createElement('div');
      sw.className = 'sw'; sw.style.background = t;
      sw.onclick = () => {
        const col = new THREE.Color(t);
        gsap.to(skinMat.color, { r: col.r, g: col.g, b: col.b, duration: 0.6 });
        document.querySelectorAll('.sw').forEach(s => s.classList.remove('on'));
        sw.classList.add('on');
      };
      document.getElementById('swatches').appendChild(sw);
    });

    document.getElementById('btnSide').onclick = () =>
      document.getElementById('sidebar').classList.toggle('away');

    // ────────────────────────────────────────────────────────────────────────────
    // MAIN LOOP
    // ────────────────────────────────────────────────────────────────────────────
    const clock = new THREE.Clock();
    function loop() {
      requestAnimationFrame(loop);
      const t = clock.getElapsedTime();
      animateWave(t);
      ctrl.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = W() / H();
      camera.updateProjectionMatrix();
      renderer.setSize(W(), H());
    });

    // Boot
    setTimeout(() => {
      loop();
      gsap.from(human.scale, { x: 0.4, y: 0.4, z: 0.4, duration: 2, ease: 'elastic.out(1, 0.5)' });
      gsap.to('#loader', {
        opacity: 0, duration: 0.8, delay: 1,
        onComplete: () => document.getElementById('loader').remove()
      });
    }, 1200);
  </script>
</body>

</html>
